services:
  phylodelta-service:
    image: phylodelta-service:local
    build:
      context: ./code/server
    restart: unless-stopped
    ports:
      # Published so the API can be used directly — curl, /docs, another
      # client — without going through the demo's proxy.
      - "${PHYLODELTA_PORT:-8001}:8000"
    environment:
      PHYLODELTA_STORE: /data/store
      PHYLODELTA_DATASETS: /data/datasets
      # 0 means one thread per core for the correspondence search. Set a
      # number on a shared machine, where taking every core is unneighbourly.
      PHYLODELTA_THREADS: "0"
      # --- authentication -------------------------------------------------
      # `mock` attaches a hardcoded user to every request and checks nothing,
      # so the demo runs with no identity provider. It is opt-in and the
      # service logs a warning at startup while it is on.
      #
      # For real authentication set PHYLODELTA_AUTH=jwt and supply the issuer,
      # the audience, and either a JWKS URL (RS256 — Google, an institutional
      # IdP, PHYLOViZ) or a shared secret of at least 32 bytes (HS256). The
      # service refuses to start if these are incomplete, rather than running
      # in an undefined auth state.
      #
      #   PHYLODELTA_AUTH: jwt
      #   PHYLODELTA_JWT_ISSUER: https://accounts.google.com
      #   PHYLODELTA_JWT_AUDIENCE: <this service's client id>
      #   PHYLODELTA_JWT_JWKS_URL: https://www.googleapis.com/oauth2/v3/certs
      PHYLODELTA_AUTH: "${PHYLODELTA_AUTH:-mock}"
      # Narrow this to the frontend's origin once it is known.
      PHYLODELTA_CORS_ORIGINS: "${PHYLODELTA_CORS_ORIGINS:-*}"
    volumes:
      # The store is derived and rebuildable, but recomputing it costs minutes
      # to hours, so it is kept rather than discarded with the container.
      - phylodelta-data:/data/store
      # Source data, read-only: the container ingests it and never writes it.
      - ./datasets:/data/datasets:ro
    healthcheck:
      # Checks that the service answers, not that the store is populated — a
      # fresh volume is empty until `build-all` has run, and the container must
      # still come up so that job can be run against it.
      test:
        [
          "CMD",
          "python",
          "-c",
          "import json, urllib.request; response=urllib.request.urlopen('http://127.0.0.1:8000/api/v1/health', timeout=3); raise SystemExit(0 if json.load(response).get('status') == 'ok' else 1)",
        ]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s

  # The other half of the 202. The API accepts an upload and records it as
  # pending; nothing computes on the request path, because ingesting a
  # 500k-node tree and building its correspondence is seconds to minutes.
  #
  # A separate service rather than a thread inside the API, for two reasons.
  # A comparison saturates every core it is given, and sharing a process with
  # the API would make request latency depend on whatever job is running. And
  # the two scale differently: uploads are cheap and bursty, comparisons are
  # expensive and serial, so `--scale phylodelta-worker=N` is the knob that
  # matters. Claiming is safe with any number of workers (db/jobs.py).
  phylodelta-worker:
    image: phylodelta-service:local
    build:
      context: ./code/server
    restart: unless-stopped
    command: ["uv", "run", "phylodelta", "worker"]
    environment:
      PHYLODELTA_STORE: /data/store
      PHYLODELTA_DATASETS: /data/datasets
      PHYLODELTA_THREADS: "0"
    volumes:
      # The same store the API serves from, read-write: this is the process
      # that writes it. Both containers must agree on the path, since the
      # database rows hold store-relative paths.
      - phylodelta-data:/data/store
      - ./datasets:/data/datasets:ro
    depends_on:
      phylodelta-service:
        condition: service_healthy

  phylodelta-demo:
    build:
      # The workspace root, not the demo directory: the demo consumes the
      # library as a workspace package and npm cannot resolve it otherwise.
      context: ./code
      dockerfile: lib_demo/Dockerfile
    ports:
      - "${PHYLODELTA_DEMO_PORT:-3001}:80"
    restart: unless-stopped
    depends_on:
      phylodelta-service:
        condition: service_healthy

volumes:
  phylodelta-data:
