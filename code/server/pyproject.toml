[project]
name = "phylodelta"
version = "0.1.0"
description = "PhyloDelta: backend for dynamic phylogenetic tree comparison — columnar tree store, pluggable comparison metrics, and a slicing API for a browser frontend."
readme = "README.md"
requires-python = ">=3.12,<3.13"
dependencies = [
    "fastapi>=0.115",
    "uvicorn[standard]>=0.32",
    "numpy>=2.1",
    "pydantic>=2.9",
]

[project.scripts]
phylodelta = "phylodelta.precompute.pipeline:main"

[dependency-groups]
dev = [
    "pytest>=8.3",
    "httpx>=0.27",
    "pybind11>=3.1.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/phylodelta"]

[tool.pytest.ini_options]
testpaths = ["tests"]
