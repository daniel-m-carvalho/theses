server {
    listen 80;
    server_name _;

    # An upload is two Newick files and optionally two typing TSVs in one
    # request: ~75 MB for the largest pair in datasets/. 300m leaves room.
    client_max_body_size 300m;

    root /usr/share/nginx/html;
    index index.html;

    location /api/v1/ {
        proxy_pass http://phylodelta-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Computing no longer happens on the request path (the worker does it,
        # the API answers 202), so this only has to cover a large upload over a
        # slow link.
        proxy_read_timeout 300s;
        proxy_request_buffering off;
    }

    # Anything else under /api/ is an API path that does not exist — another
    # version, or one nginx normalised (`/api/v1/trees/../../x` is `/api/x`).
    # Without this it would fall through to the SPA and answer 200 with
    # index.html, which a client cannot tell from a result.
    location /api/ {
        default_type application/json;
        return 404 '{"detail":"No such API path.","code":"not_found","hint":"The API is served under /api/v1/."}';
    }

    # Vite fingerprints everything under assets/, so it can be cached forever;
    # index.html must not be, or a redeploy is invisible until a hard refresh.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
