server {
    listen 80;
    server_name _;

    # Isolate TSVs are the largest upload this will ever see: 8.8 MB for
    # vibrio, 12 MB for clostridium. 300m leaves room for several at once.
    client_max_body_size 300m;

    root /usr/share/nginx/html;
    index index.html;

    # Proxying puts the browser, the API and the server on one origin, so no
    # CORS configuration is needed. The backend's permissive CORS policy
    # (allow_origins=["*"], no credentials) stays as a development
    # convenience, not as what this deployment relies on.
    #
    # /api/v1/ rather than /api/: the version lives in the path so that two
    # versions can be served side by side during a migration.
    location /api/v1/ {
        proxy_pass http://phylo-lens-service:8000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # A slice is milliseconds, but computing a pair is minutes at 500k
        # nodes. Until that moves to a job queue, the proxy must not give up
        # before the backend answers.
        proxy_read_timeout 600s;
    }

    location / {
        try_files $uri $uri/ /index.html;
    }
}
