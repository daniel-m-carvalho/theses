<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Phylogenetic Tree Viewer — side by side</title>
    <style>
      * { box-sizing: border-box; }
      body {
        margin: 0;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
        background: #eef0f2;
        color: #222;
        /* Column layout so the panels take the leftover height: the top bar can
           grow or wrap without pushing the trees off-screen. */
        height: 100vh;
        display: flex;
        flex-direction: column;
      }
      header {
        display: flex;
        align-items: center;
        justify-content: space-between;
        flex-wrap: wrap;
        gap: 10px 16px;
        padding: 10px 16px;
        background: #fff;
        border-bottom: 1px solid #d9dde1;
      }
      header h1 { margin: 0; font-size: 16px; }
      header p { margin: 4px 0 0; font-size: 12px; color: #667; }

      /* Top bar: controls that act on every panel at once. */
      #controls-global {
        display: flex;
        flex-wrap: wrap;
        gap: 6px;
        align-items: center;
      }
      .field { font-size: 12px; color: #445; }
      .field select { font-size: 12px; padding: 3px 4px; }

      /* Value picker: a <details> popover, so 144 countries stay collapsed. */
      .filter { position: relative; font-size: 12px; }
      .filter > summary {
        list-style: none;
        cursor: pointer;
        padding: 5px 10px;
        border: 1px solid #b9c0c7;
        border-radius: 4px;
        background: #fff;
        user-select: none;
      }
      .filter > summary::-webkit-details-marker { display: none; }
      .filter[open] > summary { background: #eef4fb; border-color: #1971c2; }
      .filter-list {
        position: absolute;
        z-index: 30;
        top: calc(100% + 4px);
        left: 0;
        min-width: 220px;
        max-height: 320px;
        overflow-y: auto;
        padding: 6px;
        background: #fff;
        border: 1px solid #b9c0c7;
        border-radius: 4px;
        box-shadow: 0 6px 18px rgba(0, 0, 0, 0.12);
      }
      .filter-list label {
        display: flex;
        align-items: center;
        gap: 6px;
        padding: 2px 4px;
        white-space: nowrap;
      }
      .filter-list label:hover { background: #f1f3f5; }
      .filter-list .count { margin-left: auto; color: #889; }

      /* Footer legend: what each bar colour means. */
      footer#legend {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 14px;
        padding: 8px 16px;
        background: #fff;
        border-top: 1px solid #d9dde1;
        font-size: 12px;
        flex: 0 0 auto;
      }
      #legend-values,
      #legend-comparison {
        display: flex;
        align-items: center;
        flex-wrap: wrap;
        gap: 6px 14px;
      }
      /* Same line, pushed to the far end so it keeps its place as the value
         entries change width. */
      #legend-comparison { margin-left: auto; }
      #legend-comparison:empty { display: none; }
      .gradient-ramp {
        display: inline-block;
        width: 110px;
        height: 8px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.15);
      }
      .legend-title { font-weight: 600; color: #445; }
      .legend-item { display: inline-flex; align-items: center; gap: 6px; }
      .legend-item .swatch {
        width: 12px;
        height: 12px;
        border-radius: 2px;
        border: 1px solid rgba(0, 0, 0, 0.15);
        flex: 0 0 auto;
      }
      .legend-empty { color: #778; font-style: italic; }
      button.legend-more { padding: 3px 8px; }

      .legend-dialog {
        width: min(560px, 92vw);
        max-height: 70vh;
        border: 1px solid #b9c0c7;
        border-radius: 6px;
        padding: 12px;
        font-size: 12px;
      }
      .legend-dialog::backdrop { background: rgba(0, 0, 0, 0.35); }
      .legend-dialog-head {
        display: flex;
        align-items: center;
        gap: 8px;
        margin-bottom: 8px;
      }
      .legend-dialog-head input { flex: 1 1 auto; padding: 4px 6px; font-size: 12px; }
      .legend-dialog-list {
        max-height: 50vh;
        overflow-y: auto;
        display: grid;
        grid-template-columns: repeat(auto-fill, minmax(200px, 1fr));
        gap: 2px 12px;
      }
      .legend-row { padding: 2px 0; }

      .panels {
        display: flex;
        gap: 10px;
        padding: 10px;
        flex: 1 1 auto;
        min-height: 0; /* let the panels shrink instead of overflowing the body */
      }
      .panel {
        flex: 1 1 0;
        display: flex;
        flex-direction: column;
        background: #fff;
        border: 1px solid #d9dde1;
        border-radius: 6px;
        overflow: hidden;
      }
      .panel-head {
        display: flex;
        align-items: center;
        gap: 8px;
        flex-wrap: wrap;
        padding: 8px;
        border-bottom: 1px solid #e6e9ec;
        background: #fafbfc;
      }
      .panel-head h2 { margin: 0 8px 0 0; font-size: 13px; }
      .controls { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
      .sigma-container { flex: 1 1 auto; position: relative; background: #fff; }

      button {
        padding: 5px 10px;
        font-size: 12px;
        border: 1px solid #b9c0c7;
        background: #fff;
        border-radius: 4px;
        cursor: pointer;
      }
      button:hover { background: #f1f3f5; }
      button.active { background: #1971c2; border-color: #1971c2; color: #fff; }
      .sel-count { font-size: 12px; color: #667; }
    </style>
  </head>
  <body>
    <header>
      <div>
        <h1>Phylogenetic Tree Viewer</h1>
        <p>
          Shared controls act on both trees; each panel keeps the controls that
          depend on its own configuration.
        </p>
      </div>
      <div id="controls-global"></div>
    </header>

    <div class="panels">
      <section class="panel">
        <div class="panel-head">
          <h2>vibrio · UPGMA</h2>
          <div class="controls" id="controls-left"></div>
        </div>
        <div class="sigma-container" id="panel-left"></div>
      </section>

      <section class="panel">
        <div class="panel-head">
          <h2>vibrio · NJ</h2>
          <div class="controls" id="controls-right"></div>
        </div>
        <div class="sigma-container" id="panel-right"></div>
      </section>
    </div>

    <!-- One legend row for both panels: the scales are shared, so per-panel
         legends would only repeat themselves (and overlap the trees). Bar
         colours on the left, the comparison ramp pushed to the right. -->
    <footer id="legend">
      <div id="legend-values"></div>
      <div id="legend-comparison"></div>
    </footer>

    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
